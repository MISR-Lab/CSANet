name: test_CSANet_x4
model_type: SRModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
gpu_ids: [0]
manual_seed: 0

datasets:

  test_0:  # the 1st test dataset
    name: Set5
    type: PairedImageDataset
    self_ensemble: False
    dataroot_gt:  F:\Dataset\Set5\x4\HR
    dataroot_lq:  F:\Dataset\Set5\x4\LR
    io_backend:
      type: disk
  test_1:  # the 2nd test dataset
    name: Set14
    type: PairedImageDataset
    self_ensemble: False
    dataroot_gt: F:\Dataset\Set14\x4\HR
    dataroot_lq: F:\Dataset\Set14\x4\LR
    io_backend:
      type: disk

  test_2:  # the 2nd test dataset
    name: BSDS100
    type: PairedImageDataset
    self_ensemble: False
    dataroot_gt: F:\Dataset\BSDS100\x4\HR
    dataroot_lq: F:\Dataset\BSDS100\x4\LR
    io_backend:
      type: disk

  test_3:  # the 2nd test dataset
    name: Urban100
    type: PairedImageDataset
    self_ensemble: False
    dataroot_gt: F:\Dataset\Urban100\x4\HR
    dataroot_lq: F:\Dataset\Urban100\x4\LR
    io_backend:
      type: disk

  test_4:  # the 2nd test dataset
    name: Manga109
    type: PairedImageDataset
    self_ensemble: False
    dataroot_gt: F:\Dataset\Manga109\x4\HR
    dataroot_lq: F:\Dataset\Manga109\x4\LR
    io_backend:
      type: disk

# network structures
network_g:
  type: CSANet
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_block: 16
  groups: 3
  upscale: 4
  shift_cpg: 4
  stab_cpg: 3
  reduction: 16
  res_scale: 0.1
  img_range: 255.
  rgb_mean: [0.4488, 0.4371, 0.4040]

# path
path:
  pretrain_network_g: root\best.pth
  strict_load_g: true
  param_key_g: params_ema

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
